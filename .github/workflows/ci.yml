name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats jq curl

      - name: shellcheck
        run: shellcheck skills/moc-skill/scripts/orion.sh

      - name: bats
        run: bats tests/

      - name: Verify skills CLI discovery
        run: npx skills add . --list | grep -q moc-skill
